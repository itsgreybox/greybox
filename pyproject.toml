[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greybox"
version = "0.1.0"
description = "Point at an undocumented codebase, get a plain-English assessment with an honest confidence score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
greybox = "greybox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
