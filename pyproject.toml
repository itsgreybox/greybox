[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greybox"
version = "0.1.0"
description = "Point at an undocumented codebase, get a plain-English assessment with an honest confidence score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.40.0",
    "javalang>=0.13.0",
    "esprima>=4.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/itsgreybox/greybox"
Repository = "https://github.com/itsgreybox/greybox"
Issues = "https://github.com/itsgreybox/greybox/issues"
Demo = "https://greybox-demo.vercel.app/"

[project.scripts]
greybox = "greybox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
